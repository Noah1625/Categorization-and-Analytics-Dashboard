services:
  postgres:
    image: postgres:16
    container_name: analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
