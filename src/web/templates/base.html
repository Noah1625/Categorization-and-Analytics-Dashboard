<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analytics Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <!-- HTMX: powers the partial-swap interactions. Swap for a vendored copy
       later if you want to drop the CDN dependency. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header class="topnav">
    <span class="brand"><span class="dot"></span> Analytics Dashboard</span>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('transactions') }}" class="{{ 'active' if request.endpoint == 'transactions' }}">Transactions</a>
    </nav>
    <span class="spacer"></span>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
