{% extends "base.html" %}
{% block title %}Dashboard — Analytics Dashboard{% endblock %}

{% block content %}
<div class="section">

  <h1>Dashboard</h1>
<div class="field">
    <label>Time Period</label>

    <select
        id="time-filter"
        class="select"
        name="month"
        hx-get="/dashboard/filter"
        hx-target="#dashboard-content"
        hx-swap="innerHTML">

        <option value="">All Time</option>

        {% for month in months %}
        <option value="{{ month }}" {% if month == selected_month %}selected{% endif %}>
            {{ month }}
        </option>
        {% endfor %}

    </select>
</div>

<div id="dashboard-content">
    {% include "partials/_dashboard_content.html" %}

</div>
{% endblock %}
