{% extends "base.html" %}
{% block title %}Dashboard — Analytics Dashboard{% endblock %}

{% block content %}
<div class="section">

  <h1>Dashboard</h1>
<div class="field">
    <label>Time Period</label>

    <select
        id="time-filter"
        class="select"
        name="month"
        hx-get="/dashboard/filter"
        hx-target="#dashboard-content"
        hx-swap="innerHTML">

        <option value="">All Time</option>

        {% for month in months %}
        <option value="{{ month }}">
            {{ month }}
        </option>
        {% endfor %}

    </select>
</div>

<div id="dashboard-content">

    <div class="card kpi">
        <div class="kpi-label">Total Spending</div>
        <div class="kpi-value">
            ${{ "%.2f"|format(total_spending) }}
        </div>
    </div>


  <div class="card">

    <div class="card-header">
        <h2>Spending</h2>

        <div>
            <button
                class="btn btn-primary"
                hx-get="/dashboard/category"
                hx-target="#spending-card-content"
                hx-include="#time-filter">
                Categories
            </button>

            <button
                class="btn btn-ghost"
                hx-get="/dashboard/budget"
                hx-target="#spending-card-content"
                hx-include="#time-filter">
                Budget
            </button>
        </div>
    </div>

    <div id="spending-card-content">

        {% include "partials/_category_chart.html" %}

    </div>

  </div>

</div>
{% endblock %}
